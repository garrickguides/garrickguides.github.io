<script>
(function () {
  "use strict";
  var KEY = "printDoctor.v1";
  var BOOKICON = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z" fill="none" stroke="#1F4FB8" stroke-width="2" stroke-linejoin="round"/></svg>';
  var byId = {};
  SYMPTOMS.forEach(function (s) { byId[s.id] = s; });

  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function md(t) {
    return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  }
  function plain(t) { return String(t).replace(/\*\*/g, "").replace(/`/g, ""); }
  function short(t) { var p = plain(t), k = p.search(/[.:](\s|$)/); return k > 0 ? p.slice(0, k) : p; }
  function refHtml(r) {
    return '<div class="ref">' + BOOKICON + '<span><b>Book:</b> Chapter ' + r.ch + ', ' + esc(r.sec) + '</span></div>';
  }

  /* ---------- state ---------- */
  var fresh = function () { return { view: "pick", sid: null, i: 0, j: 0, sure: true, settingsDone: false, log: [] }; };
  var state = fresh();
  var history = [];

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ state: state, history: history.slice(-60) })); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.state && (d.state.view === "pick" || byId[d.state.sid])) {
        state = d.state; history = Array.isArray(d.history) ? d.history : [];
      }
    } catch (e) {}
  }
  function go(patch) {
    history.push(JSON.stringify(state));
    var next = JSON.parse(JSON.stringify(state));
    for (var k in patch) next[k] = patch[k];
    state = next;
    save(); render(true);
  }
  function back() {
    if (!history.length) return;
    state = JSON.parse(history.pop());
    save(); render(true);
  }
  function restart() {
    history = []; state = fresh(); save(); render(true);
  }
  function addLog(what, result) {
    var l = state.log.slice(); l.push({ what: what, result: result }); return l;
  }

  /* ---------- helpers ---------- */
  function sym() { return byId[state.sid]; }
  function nextSuspectIndex(s, from) {
    var i = from;
    while (i < s.suspects.length && s.suspects[i].skip) i++;
    return i;
  }
  function skippedBefore(s, i) {
    var out = [];
    for (var k = i - 1; k >= 0 && s.suspects[k].skip; k--) out.unshift(s.suspects[k]);
    return out;
  }
  function question(su) { return su.q || ("Could the " + su.name.toLowerCase() + " cause it?"); }
  function afterSuspect(s, i) {
    var n = nextSuspectIndex(s, i + 1);
    if (n >= s.suspects.length) return { view: "help" };
    return { view: "suspect", i: n };
  }
  function pickSymptom(id) {
    var s = byId[id];
    go({ view: "start", sid: id, i: nextSuspectIndex(s, 0), j: 0, settingsDone: false, log: [] });
  }

  /* ---------- views ---------- */
  var app = document.getElementById("app");

  function viewPick() {
    var h = '<p class="stepper">Step 1 of 3</p><h2>What do you see?</h2>' +
      '<p class="lead">Pick the card closest to what is on your plate. If you see several problems, start with the one that happened first, lowest on the part.</p>' +
      '<div class="grid">';
    var lastArea = null;
    SYMPTOMS.forEach(function (s) {
      if (s.area !== lastArea) { h += '<p class="area-label">' + esc(s.area) + '</p>'; lastArea = s.area; }
      h += '<button type="button" class="card-btn" data-pick="' + s.id + '"><span class="t">' + esc(s.title) + '</span><span class="d">' + esc(plain(s.desc)) + '</span></button>';
    });
    h += '</div>' + refHtml(METHOD.ref);
    return h;
  }

  function trackHtml(s, cur) {
    var h = '<ul class="track" aria-label="Order of checks">';
    s.suspects.forEach(function (su, k) {
      var cls = k === cur ? "now" : (k < cur ? "done" : "");
      h += '<li class="' + cls + '">' + (k + 1) + ' ' + esc(su.name) + (su.skip ? ' (skip)' : '') + '</li>';
    });
    return h + '</ul>';
  }

  function viewStart() {
    var s = sym();
    var h = '<p class="stepper">Before you test</p><h2>' + esc(s.title) + '</h2>';
    if (s.pre) h += '<div class="card"><p>' + md(s.pre.text) + '</p><button type="button" class="link-btn" data-goto="' + s.pre.goto + '">Open: ' + esc(byId[s.pre.goto].title) + '</button></div>';
    if (s.warning) h += '<div class="card warn"><span class="label">Warning</span>' + md(s.warning) + '</div>';
    h += '<div class="card ctf"><span class="label">Check this first</span>' + md(s.checkFirst) + '</div>';
    if (s.signs) {
      h += '<div class="card"><span class="label">What the first layer tells you</span><table class="signs">';
      s.signs.forEach(function (r) { h += '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; });
      h += '</table></div>';
    }
    if (s.codes) {
      h += '<details class="card"><summary>Have a code on the screen?</summary><div class="codes">';
      s.codes.forEach(function (c) { h += '<div><code>' + esc(c[0]) + '</code><br>' + esc(c[1]) + '. <b>Check first:</b> ' + md(c[2]) + '</div>'; });
      h += '</div><p class="skipnote">The code on your printer can differ by model: search your exact code on Bambu\'s wiki or scan the QR code shown with the message.</p>' + refHtml(s.codesRef) + '</details>';
    }
    if (s.pathNote) h += '<div class="card"><span class="label">The order here</span>' + md(s.pathNote) + '</div>';
    if (s.knownStart) {
      h += '<div class="card"><span class="label">Go back to a known starting point</span><ol class="list">';
      METHOD.knownStart.forEach(function (t) { h += '<li>' + md(t) + '</li>'; });
      h += '</ol><p style="margin-top:10px">' + md(METHOD.oneThing) + '</p>' + refHtml(METHOD.ref) + '</div>';
    }
    if (s.tip) h += '<div class="card"><span class="label">Tip from the book</span>' + md(s.tip) + '</div>';
    h += refHtml(s.ref);
    h += '<div class="actions"><button type="button" class="btn primary" data-act="begin">' + (s.mode === "path" ? "Start the checks" : "Check the suspects in order") + '</button></div>';
    return h;
  }

  function viewSuspect() {
    var s = sym(), su = s.suspects[state.i];
    var n = s.suspects.length;
    var h = '<p class="stepper">Step 2 of 3 &middot; ' + (s.mode === "path" ? "Check " : "Suspect ") + (state.i + 1) + ' of ' + n + '</p>';
    h += '<h2>' + esc(s.title) + '</h2>' + trackHtml(s, state.i);
    skippedBefore(s, state.i).forEach(function (sk) {
      h += '<p class="skipnote">Skipped: <b>' + esc(sk.name) + '</b>. ' + esc(sk.skip) + ' The book skips it too.</p>';
    });
    h += '<div class="card"><span class="label">' + esc(su.name) + '</span><p class="q">' + esc(question(su)) + '</p>' +
      '<span class="label" style="margin-top:10px">What to look at</span><p>' + md(su.look) + '</p>' +
      refHtml(su.ref || s.ref) + '</div>';
    h += '<div class="actions three">' +
      '<button type="button" class="btn primary" data-ans="yes">Yes</button>' +
      '<button type="button" class="btn" data-ans="no">No</button>' +
      '<button type="button" class="btn" data-ans="unsure">Not sure</button></div>';
    return h;
  }

  function viewFound() {
    var s = sym(), su = s.suspects[state.i];
    var h = '<p class="stepper">Step 3 of 3 &middot; ' + esc(su.name) + '</p>';
    h += '<h2>' + (state.sure ? (s.mode === "path" ? 'Found it: ' : 'Found a suspect: ') : 'Try it to find out: ') + esc(su.name.toLowerCase()) + '</h2>';
    if (!state.sure) h += '<p class="skipnote">' + md(METHOD.notSure) + '</p>';
    h += '<div class="card ctf"><span class="label">' + (su.info ? 'What it means' : 'What to change') + '</span><p class="change">' + md(su.change) + '</p>';
    if (su.goto) h += '<button type="button" class="link-btn" data-goto="' + su.goto + '">Open: ' + esc(byId[su.goto].title) + '</button>';
    h += refHtml(su.ref || s.ref) + '</div>';
    if (su.toSettings && s.settings.length) {
      h += '<div class="actions"><button type="button" class="btn primary" data-act="toSettings">Show the settings, one at a time</button></div>';
    } else if (su.info) {
      h += '<div class="actions two"><button type="button" class="btn primary" data-act="nextSuspect">Next check</button>' +
        '<button type="button" class="btn" data-act="help">Ask for help</button></div>';
    } else {
      h += '<p class="q" style="margin-top:16px">Did it fix it?</p><div class="actions two">' +
        '<button type="button" class="btn ok" data-fix="yes">Yes, fixed</button>' +
        '<button type="button" class="btn" data-fix="no">No</button></div>' +
        (s.mode === "path" ? '' : '<p class="skipnote">' + md(METHOD.oneThing) + '</p>');
    }
    return h;
  }

  function viewSetting() {
    var s = sym(), st = s.settings[state.j], n = s.settings.length;
    var h = '<p class="stepper">Step 3 of 3 &middot; ' + esc(s.settingsTitle) + '</p>';
    h += '<h2>' + esc(s.title) + '</h2>';
    h += '<div class="card ctf"><span class="label">' + (st.group ? esc(st.group) + ' &middot; ' : '') + (state.j + 1) + ' of ' + n + '</span><p class="change">' + md(st.text) + '</p>' +
      refHtml(st.ref || s.ref) + '</div>';
    h += '<p class="q" style="margin-top:16px">Did it fix it?</p><div class="actions three">' +
      '<button type="button" class="btn ok" data-set="yes">Yes, fixed</button>' +
      '<button type="button" class="btn" data-set="no">No, next</button>' +
      '<button type="button" class="btn" data-set="na">Does not apply</button></div>';
    h += '<p class="skipnote">' + md(METHOD.undo) + '</p>';
    return h;
  }

  function logHtml() {
    if (!state.log.length) return '';
    var h = '<table class="log"><tr><th>Try</th><th>What I changed</th><th>Result</th></tr>';
    state.log.forEach(function (l, k) { h += '<tr><td>' + (k + 1) + '</td><td>' + esc(l.what) + '</td><td>' + esc(l.result) + '</td></tr>'; });
    return h + '</table>';
  }

  function viewFixed() {
    var s = sym();
    var h = '<p class="stepper">Done</p><h2>Fixed</h2>';
    h += '<div class="card okbox"><span class="label">' + esc(METHOD.fixed) + '</span><p>Keep a short record by the printer: what you changed, the test print, and the result.</p>' + logHtml() + '</div>';
    h += '<div class="card"><span class="label">How you know it worked</span><p>' + md(s.worked) + '</p>' + refHtml(s.ref) + '</div>';
    if (s.after) h += '<div class="card"><p>' + md(s.after.text) + '</p><button type="button" class="link-btn" data-goto="' + s.after.goto + '">Open: ' + esc(byId[s.after.goto].title) + '</button></div>';
    h += '<div class="actions"><button type="button" class="btn primary" data-act="restart">Check another print</button></div>';
    return h;
  }

  function viewHelp() {
    var s = sym();
    var h = '<p class="stepper">Still failing</p><h2>Ask for help</h2>';
    h += '<p class="lead">A post that answers the basic questions up front gets faster, kinder help. Test the replies you get like your own ideas: one change at a time, in suspect order.</p>';
    h += '<div class="card"><span class="label">What to include</span><ol class="list">';
    METHOD.include.forEach(function (t) { h += '<li>' + md(t) + '</li>'; });
    h += '</ol>' + refHtml(METHOD.helpRef) + '</div>';
    if (state.log.length) h += '<div class="card"><span class="label">What you tried here</span>' + logHtml() + '</div>';
    if (s.helpExtra) {
      h += '<div class="card"><span class="label">' + esc(s.helpExtraTitle) + '</span><ul class="list">';
      s.helpExtra.forEach(function (t) { h += '<li>' + md(t) + '</li>'; });
      h += '</ul>' + refHtml(s.helpExtraRef) + '</div>';
    }
    h += '<div class="card"><span class="label">Before you post</span><p>' + md(METHOD.beforePost) + '</p></div>';
    h += '<div class="card"><span class="label">When it looks like a fault</span><p>' + md(METHOD.ticket) + '</p></div>';
    h += '<div class="actions"><button type="button" class="btn primary" data-act="restart">Start over</button></div>';
    return h;
  }

  function render(focus) {
    var v = state.view, h;
    if (v !== "pick" && !sym()) { state = fresh(); v = "pick"; }
    if (v === "pick") h = viewPick();
    else if (v === "start") h = viewStart();
    else if (v === "suspect") h = viewSuspect();
    else if (v === "found") h = viewFound();
    else if (v === "setting") h = viewSetting();
    else if (v === "fixed") h = viewFixed();
    else h = viewHelp();
    app.innerHTML = h;
    document.getElementById("backBtn").hidden = !history.length;
    document.getElementById("restartBtn").hidden = (v === "pick");
    if (focus) {
      window.scrollTo(0, 0);
      var t = app.querySelector("h2"); if (t) { t.setAttribute("tabindex", "-1"); t.focus({ preventScroll: true }); }
    }
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var s = sym();
    if (b.dataset.pick) return pickSymptom(b.dataset.pick);
    if (b.dataset.goto) return pickSymptom(b.dataset.goto);
    var act = b.dataset.act;
    if (act === "begin") return go({ view: "suspect", i: nextSuspectIndex(s, 0) });
    if (act === "restart") return restart();
    if (act === "help") return go({ view: "help" });
    if (act === "nextSuspect") return go(afterSuspect(s, state.i));
    if (act === "toSettings") {
      if (state.settingsDone) return go(afterSuspect(s, state.i));
      return go({ view: "setting", j: 0, log: state.log });
    }
    if (b.dataset.ans) {
      var a = b.dataset.ans;
      if (a === "no") return go(afterSuspect(s, state.i));
      return go({ view: "found", sure: a === "yes" });
    }
    if (b.dataset.fix) {
      var su = s.suspects[state.i];
      var what = su.name + ": " + short(su.change);
      if (b.dataset.fix === "yes") return go({ view: "fixed", log: addLog(what, "Fixed") });
      var lg = addLog(what, "Not fixed, undone");
      if (s.settings.length && !state.settingsDone) return go({ view: "setting", j: 0, log: lg });
      var nx = afterSuspect(s, state.i); nx.log = lg; return go(nx);
    }
    if (b.dataset.set) {
      var st = s.settings[state.j];
      var w = (st.group ? st.group + ": " : "") + short(st.text);
      if (b.dataset.set === "yes") return go({ view: "fixed", log: addLog(w, "Fixed") });
      var l2 = b.dataset.set === "no" ? addLog(w, "Not fixed, undone") : state.log;
      if (state.j + 1 < s.settings.length) return go({ view: "setting", j: state.j + 1, log: l2 });
      var nx2 = afterSuspect(s, state.i); nx2.log = l2; nx2.settingsDone = true; return go(nx2);
    }
  });
  document.getElementById("backBtn").addEventListener("click", back);
  document.getElementById("restartBtn").addEventListener("click", restart);
  document.getElementById("foot").textContent = BOOK.footer;

  load();
  render(false);
})();
</script>
</body>
</html>
